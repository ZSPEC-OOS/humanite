name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, production]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/humanite

jobs:
  # ── Build and push Docker images ─────────────────────────────────────────────
  build-gateway:
    name: Build Gateway Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/gateway
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - id: build
        uses: docker/build-push-action@v5
        with:
          context: services/gateway
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-orchestration:
    name: Build Orchestration Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/orchestration
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - id: build
        uses: docker/build-push-action@v5
        with:
          context: services/orchestration
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web:
    name: Build Web Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/web
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - id: build
        uses: docker/build-push-action@v5
        with:
          context: apps/web
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to staging ────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: [build-gateway, build-orchestration, build-web]
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4

      - name: Configure kubectl
        run: echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > /tmp/kubeconfig

      - name: Deploy to staging
        env:
          KUBECONFIG: /tmp/kubeconfig
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl apply -k infra/k8s/overlays/staging
          kubectl set image deployment/gateway \
            gateway=${{ env.IMAGE_PREFIX }}/gateway:$(echo $IMAGE_TAG | cut -c1-7) \
            -n humanite-staging
          kubectl set image deployment/orchestration \
            orchestration=${{ env.IMAGE_PREFIX }}/orchestration:$(echo $IMAGE_TAG | cut -c1-7) \
            -n humanite-staging
          kubectl rollout status deployment/gateway -n humanite-staging --timeout=5m
          kubectl rollout status deployment/orchestration -n humanite-staging --timeout=5m

  # ── Smoke test staging ───────────────────────────────────────────────────────
  smoke-staging:
    name: Smoke Test Staging
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    environment: staging
    steps:
      - name: Health checks
        run: |
          for endpoint in \
            "${{ secrets.STAGING_URL }}/v1/health" \
            "${{ secrets.STAGING_URL }}/metrics"; do
            echo "Checking $endpoint …"
            curl --fail --silent --max-time 10 "$endpoint" || exit 1
          done
          echo "All smoke tests passed."

  # ── Deploy to production (manual gate via environment protection) ─────────────
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: [smoke-staging]
    environment: production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4

      - name: Configure kubectl
        run: echo "${{ secrets.KUBECONFIG_PRODUCTION }}" | base64 -d > /tmp/kubeconfig

      - name: Deploy to production
        env:
          KUBECONFIG: /tmp/kubeconfig
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl apply -k infra/k8s/overlays/production
          kubectl set image deployment/gateway \
            gateway=${{ env.IMAGE_PREFIX }}/gateway:$(echo $IMAGE_TAG | cut -c1-7) \
            -n humanite-production
          kubectl set image deployment/orchestration \
            orchestration=${{ env.IMAGE_PREFIX }}/orchestration:$(echo $IMAGE_TAG | cut -c1-7) \
            -n humanite-production
          kubectl rollout status deployment/gateway -n humanite-production --timeout=10m
          kubectl rollout status deployment/orchestration -n humanite-production --timeout=10m
