name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/humanite

jobs:
  # ── Go gateway ──────────────────────────────────────────────────────────────
  gateway:
    name: Gateway (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Build
        run: CGO_ENABLED=0 go build -race ./...

      - name: Test
        run: go test -race -timeout 60s ./...

  # ── Python services ──────────────────────────────────────────────────────────
  orchestration:
    name: Orchestration (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/orchestration
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/orchestration/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short

  preprocessing:
    name: Preprocessing (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/preprocessing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/preprocessing/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download spaCy models
        run: python -m spacy download en_core_web_sm

      - name: Run tests
        run: pytest tests/ -v --tb=short

  scanner:
    name: Scanner (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/scanner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/scanner/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short

  user-management:
    name: User Management (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/user-management
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/user-management/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # ── Web frontend ─────────────────────────────────────────────────────────────
  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm tsc --noEmit

      - name: Build
        run: pnpm build

  # ── ML regression gate (runs on scanner or ml path changes) ──────────────────
  ml-regression:
    name: ML Regression Gate
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      (contains(github.event.pull_request.changed_files, 'services/scanner') ||
       contains(github.event.pull_request.changed_files, 'ml/'))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanner dependencies
        run: pip install -r services/scanner/requirements.txt pandas pyarrow

      - name: Create golden set
        run: python ml/evaluation/golden_set/create_golden_set.py

      - name: Run regression gate
        run: |
          python ml/evaluation/benchmarks/scanner_regression.py \
            --update-baseline || true
          python ml/evaluation/benchmarks/scanner_regression.py \
            --max-drop 0.02

  # ── Security scan ────────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
